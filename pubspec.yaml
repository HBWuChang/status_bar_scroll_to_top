name: status_bar_scroll_to_top
description: Native Android scroll proxy forwarding OEM status bar scroll-to-top requests to Flutter.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.xiebian.statusbar_scroll_to_top
        pluginClass: StatusBarScrollToTopPlugin
